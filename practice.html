<head>

    <style>
        #btn:hover{

        }

            color:blue;

        }
        a:active {
    color: red;
}

</head>
<body>
  <button id="btn" title = "jaideep is choot">
    <b>click me</b></button>
  <input type="text" placeholder="Focus me">
<a id="link" href="https://example.com" alt="w3c link pseudoclasses">w3c Link</a>
  <script>
    let call = document.getElementById("btn");
    call.textContent = "this is new button";

    let links = document.getElementById("link");

      event.preventDefault();
      alert("link clicked");
    });
  </script>
